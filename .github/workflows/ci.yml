name: CI

on:
  push:
    branches: [ develop, main ]
  pull_request:
    branches: [ develop, main ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: weirwise
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"
          uv pip install --system -e packages/python-sdk

      - name: Check code formatting and linting
        run: |
          ruff check .
          ruff format --check .

      - name: Run Alembic database migrations
        env:
          WEIRWISE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/weirwise
          WEIRWISE_DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/weirwise
        run: |
          alembic -c server/alembic.ini upgrade head

      - name: Run tests
        env:
          PYTHONPATH: ".:packages/python-sdk"
          WEIRWISE_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/weirwise
          WEIRWISE_DATABASE_SYNC_URL: postgresql://postgres:postgres@localhost:5432/weirwise
          RUN_POSTGRES_TESTS: "1"
        run: |
          pytest server/tests packages/python-sdk/tests

      - name: Verify Core and SDK packaging and distribution build
        run: |
          python -m pip install build
          python -m build packages/python-sdk
          python -m build .

  docker-validation:
    name: Docker Build Validation
    needs: [test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Core Docker Build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: weirwise-rag-core:test
